  <script>
    const RAW_MD = "# Goldman Sachs QIS Research Note — `SOXL` · `SOXS` 3x 반도체 양방향 동적 알파 및 변동성 제어 전략 (1Y Karpathy Autoresearch)\n\n**Desk**: Quantitative Investment Strategies (QIS) & Autonomous Alpha Research  \n**Analytics Engine**: Goldman Sachs Open-Source `gs_quant.timeseries` + Karpathy Immutable Judge (`Calmar >= 1.50` & Sealed OOS Gate)  \n**Evaluation Horizon**: `2025-11-20 ~ 2026-11-20` (최근 1년 정규 252거래일 / 1분봉 97,253바 + 사전 웜업 별도)  \n**Universe**: `SOXL` (Direxion Daily Semiconductor Bull 3X) · `SOXS` (Direxion Daily Semiconductor Bear 3X) · `USD Cash`\n\n> [!IMPORTANT]\n> **핵심 투자 결론 (Executive Thesis)**: 최근 1년 반도체 3배 레버리지 시장은 앞 80% 급등(`SOXL +275.3%`) 직후 봉인된 뒤 20% 구간에서 **`SOXL -73.30%` 폭락**이 발생하며 무방비 보유 수익이 전액 소멸(`SOXL 1Y +0.21%`, `MDD -89.75%` / `SOXS 1Y -90.78%`)한 전형적인 **변동성 잠식(Volatility Drag)** 장세였습니다. 카파시 Autoresearch 23회 진화(`v_51`~`v_73`) 결과, 장기 변동성 타게팅 코어(`v_71.py`), 중기 다단 스윙(`v_68.py`), 초단기 스냅백·거절확인(`v_61.py`)을 순노출 상계로 결합한 **올웨더 통합 메타 앙상블(`v_73.py`)**이 **1년 누적 수익률 `+41.15%`, `gs_quant` 연율화 샤프 `1.938`, 최대낙폭(MDD) `-9.09%`, `SPY` 베타 `-0.128`**을 달성하며 전 구간 우위를 입증했습니다.\n\n---\n\n## 1. 3배 레버리지 양방향 구조 역학 (Structural Mechanics & Decay Math)\n\n일일 수익률 $\\mu$, 일일 변동성 $\\sigma$인 기초지수(`SOXX`)를 추종하는 $L=\\pm 3$ 일일 리밸런싱 ETF의 연속 복리 성장률은 변동성 제곱에 비례하는 음(-)의 드리프트 항을 내포합니다.\n\n$$g_L \\approx L\\mu - \\frac{1}{2} L(L - 1)\\sigma^2 - c_{\\text{expense}}$$\n\n* `SOXL`($L = +3$)은 $-\\,3\\sigma^2$, `SOXS`($L = -3$)는 $-\\,6\\sigma^2$의 일간 복리 잠식이 상시 발생합니다.\n* 동일 시점에 `SOXL`과 `SOXS`를 동시 보유(예: `50:50` 리밸런싱)하면 방향성 노출은 0으로 상쇄되는 반면 **양쪽 디케이와 리밸런싱 비용만 확정 손실(`1Y -2.08%`, `Sharpe -0.77`)**로 누적됩니다.\n* 따라서 모든 유효 전략은 **순노출 상계 제약($w_{\\text{SOXL},t} \\cdot w_{\\text{SOXS},t} = 0$)** 하에서 ① 확정 추세·과매도 반등 국면에만 `SOXL` 투입, ② 중기 추세 붕괴·베어 반등 거절 국면에만 제한 비중 `SOXS` 위기 알파 가동, ③ 고변동 혼조장에서는 **현금(`Cash`)**으로 대피해야 합니다.\n\n```mermaid\nflowchart LR\n    DATA[\"Market Data (SOXL / SOXS 1Y)\"] --> S1[\"Sleeve 1: v_61 초단기 평균회귀 (가중 0.40)\"]\n    DATA --> S2[\"Sleeve 2: v_68 중기 다단 스윙 (가중 0.30)\"]\n    DATA --> S3[\"Sleeve 3: v_71 장기 변동성 코어 (가중 0.70)\"]\n    S1 --> NET[\"순노출 상계 엔진 (Net = Bull - Bear)\"]\n    S2 --> NET\n    S3 --> NET\n    NET -->|\"Net > +0.02\"| BULL[\"SOXL 단독 편입 (상한 88%)\"]\n    NET -->|\"|Net| <= 0.02\"| CASH[\"100% 현금 방어 (Decay 차단)\"]\n    NET -->|\"Net < -0.02\"| BEAR[\"SOXS 단독 편입 (상한 42%)\"]\n```\n\n---\n\n## 2. `gs_quant.timeseries` 정량 리스크 및 구간별 성과 분해\n\n골드만삭스 오픈소스 `gs_quant.timeseries` 엔진(`volatility`, `sharpe_ratio`, `max_drawdown`, `beta`, `correlation`, 63거래일 롤링 윈도우)으로 산출한 장르별 대표 전략 및 벤치마크 비교표입니다.\n\n### 2.1 전체 1년 구간 (`Full Period: 2025-11-20 ~ 2026-11-20`)\n\n| 장르 / 전략 | 인터랙티브 티어시트 | 누적 수익률 | 연율화 변동성 (`gs_quant`) | `gs_quant` Sharpe | 최대낙폭 (`gs_quant` MDD) | `SPY` 대비 베타 ($\\beta$) | `SPY` 상관계수 ($\\rho$) | 최근 63일 롤링 Sharpe / MDD |\n| :--- | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 패시브 `SOXL` 100% | — | `+0.21%` | `~94.2%` | `0.800` | `-89.75%` | `+3.41` | `+0.78` | 급락 전환 |\n| 패시브 `SOXS` 100% | — | `-90.78%` | `~95.8%` | `-0.790` | `-96.74%` | `-3.38` | `-0.77` | 장기 소멸 |\n| 패시브 `50:50` 리밸런싱 | — | `-2.08%` | `1.92%` | `-0.770` | `-2.69%` | `0.00` | `0.00` | 지속 음수 |\n| **1. 단타 (`1min`)** `v_53.py` | [report_v_53.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_53.html) | `-6.29%` | `6.85%` | `-0.914` | `-9.74%` | `+0.063` | `+0.119` | `+0.326` / `-3.19%` |\n| **2. 초단기 (`daily`)** `v_61.py` | [report_v_61.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_61.html) | **`+11.13%`** | `13.01%` | **`0.854`** | `-8.68%` | `-0.098` | `-0.073` | `+0.216` / `-8.68%` |\n| **3. 스윙 (`daily`)** `v_68.py` | [report_v_68.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_68.html) | **`+21.44%`** | `18.85%` | **`1.135`** | **`-8.18%`** | `-0.084` | `-0.043` | `+0.783` / `-2.55%` |\n| **4. 장투 (`daily`)** `v_71.py` | [report_v_71.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_71.html) | **`+41.08%`** | `21.94%` | **`1.868`** | `-9.48%` | `-0.091` | `-0.040` | **`+0.895`** / `-7.70%` |\n| **5. 통합 챔피언** `v_73.py` | [report.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_73.html) | **`+41.15%`** | `21.19%` | **`1.938`** | `-9.09%` | **`-0.128`** | `-0.059` | `+0.830` / `-6.59%` |\n\n### 2.2 In-Sample (`앞 80%`) vs Sealed OOS (`뒤 20% 봉인 폭락장`) 스트레스 검증\n\n> [!TIP]\n> **봉인 구간(Sealed OOS) 위기 알파 검증**: 전략 개발 중 일절 열람하지 않은 마지막 20% 구간에서 기초 자산 `SOXL`이 **`-73.30%` 폭락**했음에도, `v_53`·`v_61`·`v_68`·`v_71`·`v_73` **5개 장르 대표 전략 전원이 `gs_quant` 일간 집계 기준 플러스 수익(`+0.56% ~ +1.43%`) 및 한 자릿수 MDD(`-2.38% ~ -8.68%`)**를 기록하며 과적합이 아닌 구조적 방어력을 증명했습니다.\n\n| 전략 버전 | IS 누적 수익률 (`gs_quant`) | IS 연변동성 | IS Sharpe | IS MDD | Sealed OOS 수익률 (`gs_quant`) | OOS 연변동성 | OOS Sharpe | OOS MDD | OOS 베타 ($\\beta$) |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| **`v_53`** (1분봉 단타) | `-6.83%` | `6.44%` | `-1.298` | `-9.66%` | `+0.57%` | `8.38%` | `+0.357` | `-3.19%` | `+0.015` |\n| **`v_61`** (초단기 평균회귀) | `+9.69%` *(원시 +11.37%)* | `11.08%` | `+1.092` | `-6.38%` | **`+1.31%`** | `19.05%` | `+0.381` | `-8.68%` | `+0.001` |\n| **`v_68`** (중기 다단 스윙) | `+20.76%` | `20.62%` | `+1.271` | `-8.18%` | `+0.56%` | **`8.61%`** | `+0.354` | **`-2.38%`** | `-0.004` |\n| **`v_71`** (장투 변동성 코어) | **`+39.79%`** | `24.00%` | `+2.132` | `-9.48%` | `+0.93%` | `9.82%` | `+0.517` | `-2.51%` | `-0.011` |\n| **`v_73`** (**올웨더 통합 챔피언**) | **`+39.16%`** *(원시 +40.01%)* | `22.88%` | **`+2.200`** | `-9.09%` | **`+1.43%`** | `12.14%` | **`+0.653`** | `-4.91%` | `-0.008` |\n\n---\n\n## 3. 장르별 카파시 Autoresearch 진화 계보 (`v_51` ~ `v_73` 전수 기록)\n\n### 3.1 장르 1 — 인트라데이 1분봉 데이트레이딩 (`v_51` ~ `v_55`, 오버나잇 노출 0%)\n* **설계 목적**: 정규장 마감 10분 전(`15:50 ET`, 조기폐장일 `12:50 ET`) 전량 현금화로 오버나잇 갭 리스크를 제거한 순수 당일 매매 검증.\n* **부검 진화 요약**:\n  - `v_51` (`#71`, ORB 30분 돌파): 104회 과매매로 왕복 40bps 비용 누적 및 점심장 고점 물림(`TREND_REVERSAL_LOSS`), IS `-25.64%` (`MDD 32.68%`), 단 OOS 추세장에서는 `+6.68%` 기록.\n  - `v_52` (`#72`, 카우프만 효율성 `ER >= 0.35`): 과매매 제거(`IS +0.09%`, `MDD 2.59%`), 단 표본 부족(`6회 < 10회`, `INSUFFICIENT_TRADES`).\n  - `v_53` (`#73`, ORH 돌파 후 첫 VWAP·EMA20 눌림 재탈환): 32회(`SOXL 18일 : SOXS 14일`), MDD `10.55%`, OOS `+0.57%` 달성했으나 당일 상승분 추격 후 장중 평균회귀 역풍으로 IS `-6.83%`.\n  - `v_54`~`v_55` (`#74`~`#75`, 장중 `-3.5%+` 투매 역추세 반등 및 2차 바닥 확인): 승률을 `31.3% → 42.9%`로 끌어올리고 `WHIPSAW_CHOP`·`HIGH_VOL_SPIKE` 손실을 제거했으나, **편도 20bps(왕복 40bps) 마찰비용 + 반도체 오버나잇 양(+)의 드리프트 포기**라는 데이트레이딩 본연의 비용 한계를 실증함.\n\n> [!WARNING]\n> **실전 트레이딩 시사점 (데이트레이딩 마찰장벽)**: `SOXL`·`SOXS`에서 호가 스프레드+슬리피지가 편도 `15~20bps` 이상 발생하는 환경에서는 순수 1분봉 당일 청산보다 **오버나잇 추세·스냅백 프리미엄을 수취하는 일봉 기반 전략(`v_61`~`v_73`)의 순기대값(Expectancy)이 압도적으로 높습니다.**\n\n### 3.2 장르 2 — 초단기 평균회귀 단기매매 (`v_56` ~ `v_61`, 보유 2~5일)\n* **진화 핵심**: `v_56`(`#76`, `SMA200` 기준 역추세 손실) → `v_57`(`#77`, `SMA50` 분기 도입 시 IS `Calmar 2.61` 급등, 단 무확인 `SOXS` 진입으로 OOS 기각) → `v_58`(`#78`, `max(vol5,vol20)` 변동성 제어 검증 및 `SMA50` 하회 `SOXL` 진입 위험 확인) → `v_59`(`#79`, OOS 양전 성공) → `v_60`(`#80`, 강세장 불플래그 `SOXS` 제거로 IS `Calmar 1.87`) → **`v_61.py` (`#81`, 최종 PASS)**.\n* **`v_61` 시그널 명세**:\n  - **`SOXL` 진입**: `Close >= SMA50` 중기 강세 지지 내 `RSI(2) < 16` 단기 패닉 급락 발생 시 변동성 역가중 진입 → 전일 고가(`High[t-1]`) 돌파 또는 `SMA5` 회복 시 즉각 익절.\n  - **`SOXS` 진입**: `Close < SMA50` 및 `SMA10 < SMA50` 중기 조정 체제에서 기술적 반등(`SOXS RSI2 < 38`) 후 **실제 `SOXL` 음봉 거절 + `SOXS` 양봉 전환이 동시 확인된 날** 제한 비중(`~0.22`) 진입.\n\n### 3.3 장르 3 — 중기 스윙 트레이딩 (`v_62` ~ `v_68`, 보유 1~3주)\n* **진화 핵심**: `v_62`~`v_65`(`#82`~`#85`, 고변동 분배장 및 후행 정배열 추격 손실 진단) → `v_66`(`#86`, 15일 돈치안 신고가 돌파가 3배 ETF 박스권 상단 물림을 유발함을 확인 후 폐기) → `v_67`(`#87`, 비과열 응축 다단 스윙으로 축 전환하여 IS·OOS 동시 흑자) → **`v_68.py` (`#88`, 최종 PASS)**.\n* **`v_68` 시그널 명세**:\n  - **`SOXL` 스윙**: `Close > SMA50`, `EMA10 > EMA30`, `SMA20` 2봉 연속 안착 + **10일·20일 복수 양모멘텀(`m10 > 0`, `m20 > +2%`)** + **최근 5일 투매 충격 부재(`min_ret5 > -10%`)** + 비과열(`46 <= RSI14 <= 68.5`) 충족 시 진입.\n  - **`SOXS` 스윙**: 중기 역배열 확정 구간 중 과매도 투매 바닥(`RSI14 < 34`)을 피한 하락 추세 구간에 `0.18~0.38` 비중 진입 및 빠른 트레일링 이익 잠금.\n\n### 3.4 장르 4 — 장투 / 매크로 포지션 & 변동성 타게팅 (`v_69` ~ `v_71`, 수주~수개월 코어)\n* **진화 핵심**: `v_69`(`#89`, IS `Calmar 6.13` 달성했으나 리밸런싱 임계 미작동으로 OOS 반납) → `v_70`(`#90`, 비대칭 방어 축소 도입, 트레일링 지연 수정 필요) → **`v_71.py` (`#91`, 최종 PASS, IS `Calmar 5.51`, 1Y `+41.08%`)**.\n* **`v_71` 시그널 명세**:\n  - **강세 장기 코어(`SOXL`)**: 인위적 시간 청산 없이 대세 상승장을 연속 보유(`0.45~0.82`)하되, 단기 과열·변동성 스파이크 국면에서는 전량 매도 대신 **`0.20` 방어 코어로 축소 유지 후 안정 시 재확대**하여 장기 복리를 극대화합니다. 단, 파동 수익 `+11%` 이상 도달 후 피크 대비 실질 가격 반락(`36%` 되돌림 또는 `-6.8%p`) 발생 시 조건 없이 이익을 확정하고 즉시 재진입 대기(`cooldown = 0`)합니다.\n  - **위기 알파 슬리브(`SOXS`)**: 거시 약세 체제에서만 `0.20~0.36` 제한 비중으로 편입해 폭락장 포트폴리오 손실을 상쇄합니다.\n\n### 3.5 장르 5 — 올웨더 통합 메타 앙상블 챔피언 (`v_72` ~ `v_73`)\n* **진화 핵심**: `v_72`(`#92`)에서 하위 전략에 임의 필터를 덧씌우고 단기 역추세 가중치를 과대 배정(`0.90`)하자 OOS 안정성이 훼손됨을 부검으로 확인하고, **`v_73.py` (`#93`, 최종 우승)**에서 검증된 원본 3대 슬리브를 코어-새틀라이트 리스크 패리티 비율(`장기코어 0.70 : 중기스윙 0.30 : 초단기 0.40`) 및 순노출 상계로 결합하여 **전 실험 최고 `gs_quant Sharpe 1.938` (`IS Calmar 5.78`, `OOS Sharpe 0.653`)**을 완성했습니다.\n* **잔존 리스크 부검 (`v_73` In-Sample Top 3 손실 에피소드)**:\n  1. `2025-12-03 ~ 2025-12-14` (`8거래일`, `-4.85%`, 평균비중 `0.428`): 저변동 횡보 후 추세 반전(`LATE_EXIT_GIVEBACK`) — 단일 최대 손실이 `-5%` 미만으로 엄격히 통제됨.\n  2. `2026-08-02 ~ 2026-08-03` (`2거래일`, `-1.97%`, 평균비중 `0.088`): 고변동 스파이크 구간 소액(`8.8%`) 탐색 손절(`WHIPSAW_CHOP`).\n  3. `2025-12-18` (`1거래일`, `-1.76%`, 평균비중 `0.213`): 단기 휩소 즉시 차단(`WHIPSAW_CHOP`).\n\n---\n\n## 4. 리포트 아카이브 및 검증 명령어 안내\n\n> [!NOTE]\n> 모든 전략의 오프라인 완결형 **Goldman Sachs `gs_quant.timeseries` 6단 인터랙티브 Plotly 티어시트 HTML**(`누적 자산곡선`, `수중 낙폭 & 롤링 MDD`, `롤링 변동성`, `롤링 샤프`, `SPY 대비 롤링 베타·상관계수`, `일별 SOXL/SOXS 노출 비중`)이 아래 경로에 생성되어 있습니다.\n\n* **통합 챔피언 메인 티어시트**: [report.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_73.html) (동일 사본: [report_v_73.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_73.html))\n* **장르별 우승 티어시트**:\n  - 단타(`1min`): [report_v_53.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_53.html)\n  - 초단기(`daily`): [report_v_61.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_61.html)\n  - 스윙(`daily`): [report_v_68.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_68.html)\n  - 장투(`daily`): [report_v_71.html](https://tron1981-maker.github.io/soxl-soxs-1y/report_v_71.html)\n* **브라우저 즉시 열기 / 대시보드 탐색기 실행 명령 (PowerShell)**:\n  ```powershell\n  # 최종 챔피언(v_73) 인터랙티브 티어시트 브라우저로 열기\n  Start-Process \"d:\\100_bibe_coding\\04_stock\\13_재귀트레이딩\\trading-loop\\backtests\\report.html\"\n\n  # Streamlit gs_quant 인터랙티브 리스크 탐색기 실행\n  & \"d:\\100_bibe_coding\\04_stock\\13_재귀트레이딩\\trading-loop\\.venv\\Scripts\\python.exe\" -m streamlit run \"d:\\100_bibe_coding\\04_stock\\13_재귀트레이딩\\streamlit_explorer.py\"\n  ```\n";
    function preprocessMd(md) {
      // GitHub Alert 토큰 정리
      md = md.replace(/> \[!(IMPORTANT|TIP|WARNING|NOTE)\]\s*\n/g, '> **[$1]** ');
      // Display math $$...$$ 보호
      const maths = [];
      md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => {
        const idx = maths.length;
        maths.push({ display: true, expr: expr.trim() });
        return `@@MATH_${idx}@@`;
      });
      md = md.replace(/\$([^\$\n]+?)\$/g, (_, expr) => {
        const idx = maths.length;
        maths.push({ display: false, expr: expr.trim() });
        return `@@MATH_${idx}@@`;
      });
      return { md, maths };
    }

    const { md, maths } = preprocessMd(RAW_MD);
    let rendered = (typeof marked !== 'undefined') ? marked.parse(md) : `<pre>${md.replace(/</g,'&lt;')}</pre>`;
    // Mermaid code block -> div.mermaid
    rendered = rendered.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, code) => {
      const decoded = code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"');
      return `<div class="mermaid">${decoded}</div>`;
    });
    // Restore KaTeX math
    rendered = rendered.replace(/@@MATH_(\d+)@@/g, (_, idx) => {
      const m = maths[Number(idx)];
      try {
        if (typeof katex !== 'undefined') {
          const html = katex.renderToString(m.expr, { displayMode: m.display, throwOnError: false });
          return m.display ? `<div class="math-block">${html}</div>` : html;
        }
        return m.expr;
      } catch (e) {
        return m.expr;
      }
    });
    document.getElementById('content').innerHTML = rendered;
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({ startOnLoad: false, theme: 'default' });
      mermaid.run();
    }

    function setDocBg(mode, btn) {
      if (mode === 'white') document.documentElement.removeAttribute('data-bg');
      else document.documentElement.setAttribute('data-bg', mode);
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
